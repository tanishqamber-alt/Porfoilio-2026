<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: true, say: false, n: 0 }; }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const { dark, say, n } = this.state;
    return {
      themeCls: dark ? 'dark' : '',
      lightPressed: dark ? 'false' : 'true',
      darkPressed: dark ? 'true' : 'false',
      setLight: () => this.setState({ dark: false }),
      setDark: () => this.setState({ dark: true }),
      reload: () => { window.location.reload(); },
      back: () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = '/';
      },
      snd: this.state.snd || { cls: 'is-off is-unset', pressed: 'false', label: 'Sound off', tip: 'Sound off · click to turn on' },
      sndToggle: () => { if (this._snd) this._snd.toggle(); },
      sndReady: (api) => { this._snd = api; },
      sndState: (s) => this.setState({ snd: s }),
      catCls: say ? 'cat say' : 'cat',
      bubText: n % 3 === 0 ? 'Lost too?' : 'Meow!',
      pet: () => {
        clearTimeout(this._t);
        if (this._snd && (n + 1) % 3 !== 0) this._snd.cat('meow'); /* only when the bubble says Meow! */
        this.setState({ say: false, n: n + 1 }, () => {
          requestAnimationFrame(() => this.setState({ say: true }));
          this._t = setTimeout(() => this.setState({ say: false }), 1400);
        });
      }
    };
  }
}
</script>
